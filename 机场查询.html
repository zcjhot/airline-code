<!DOCTYPE html>
<html lang="zh" style="font-size: 20px;">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>机场查询</title>
    <link rel="icon" type="image/png" href="img/A.svg?v=20261002125637">
	<link rel="stylesheet" href="css/softkeys-0.0.1.css?v=20261002125637">
</head>
<body>
    <div class="page-wrapper">
        <!-- Input + Keyboard -->
        <div class="input-card">
            <div class="input-label">ICAO Code</div>
            <form>
                <div>
                    <input type="text" name="code" class="form-control" disabled style="font-size:2rem;">
                </div>
            </form>
            <div class="keyboard-section">
                <div class="softkeys softkeys--lg" data-target="input[name='code']"></div>
            </div>
        </div>

        <!-- Results Table -->
        <div class="table-card">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">四字码</th>
                        <th scope="col">国家</th>
                        <th scope="col">省/州</th>
                        <th scope="col">城市</th>
                        <th scope="col">机场名</th>
                    </tr>
                </thead>
                <tbody id="my_table">
                    <tr>
                        <th scope="row">...</th>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                    </tr>
                </tbody>
            </table>
            <div class="results-info">
                <span><span class="dot"></span>最多显示 100 条结果</span>
                <span id="result-count"></span>
            </div>
        </div>
    </div>

	<script src="js/jquery-1.11.0.min.js?v=20261002125637"></script>
	<script src="js/softkeys-0.0.1.js?v=20261002125637"></script>
	<script src="js/airports_slim.js?v=20261005200000"></script>
	<script type="text/javascript">
		$(document).ready(function(){
            $('.softkeys').softkeys({
                target : $('.softkeys').data('target'),
                layout : [
                    [
                        'Q','W','E','R','T','Y','U','I','O','P',
                        'delete'
                    ],
                    [
                        'A','S','D','F','G','H','J','K','L',
                    ],
                    [
                        'Z','X','C','V','B','N','M',
                    ]
                ]
            });
        });
	</script>
<script>
    var $input = $('input[name="code"]');
    var $charCount = $('.char-count');
    var $statusIndicator = $('.status-indicator');
    var $statusText = $('.status-text');
    var $resultCount = $('#result-count');

    var my_table = document.getElementById("my_table")
    var R = airportData.R;   // 行数组(值数组)，字段下标: 0=icao 2=name 3=city 4=state 5=country 6=city_chi 7=country_chi 8=state_chi 9=airport_chi

    search("");

    updateCharCount($input.val().length);

    $input.on('input', function() {
        var value = $(this).val();
        if (value.length > 4) {
            $(this).val(value.substring(0, 4));
            value = $(this).val();
        }
        updateCharCount(value.length);
        search(value);
    });

    function updateCharCount(count) {
        $charCount.text(count + '/4');
        if (count === 3) {
            $charCount.removeClass('warning').addClass('danger');
        } else if (count >= 2) {
            $charCount.removeClass('danger').addClass('warning');
        } else {
            $charCount.removeClass('warning danger');
        }
    }

    function search(value) {
        // 一趟循环完成: 前缀过滤 + 计数 + 拼接前 100 行 HTML，最后一次性写入（单次重排）
        var total = 0, count = 0, html = [];
        for (var i = 0; i < R.length; i++) {
            var r = R[i];
            if (r[0].startsWith(value)) {
                total++;
                if (count < 100) {
                    html.push('<tr><th scope="row"><span class="my_badge">' + r[0] + '</span></th>' +
                        '<td><div>' + r[5] + '</div><div>' + r[7] + '</div></td>' +
                        '<td><div>' + r[4] + '</div><div>' + r[8] + '</div></td>' +
                        '<td><div>' + r[3] + '</div><div>' + r[6] + '</div></td>' +
                        '<td><div>' + r[2] + '</div><div>' + r[9] + '</div></td></tr>');
                    count++;
                }
            }
        }
        html.push('<tr><th scope="row">...</th><td>...</td><td>...</td><td>...</td><td>...</td></tr>');
        my_table.innerHTML = html.join('');
        $resultCount.text(total > 100 ? '共 ' + total + ' 条' : '');
    }

    $input.on('keypress', function(e) {
        if ($(this).val().length >= 3) {
            e.preventDefault();
            return false;
        }
    });
</script>
</body>
</html>
