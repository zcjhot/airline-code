<!DOCTYPE html>
<html lang="zh" style="font-size: 20px;">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>机场查询</title>
    <link rel="icon" type="image/png" href="img/A.svg?v=20261002125637">
	<link rel="stylesheet" href="css/softkeys-0.0.1.css?v=20261002125637">
</head>
<body>
    <div class="page-wrapper">
        <!-- Input + Keyboard -->
        <div class="input-card">
            <div class="input-label">ICAO Code</div>
            <form>
                <div>
                    <input type="text" name="code" class="form-control" disabled style="font-size:2rem;">
                </div>
            </form>
            <div class="keyboard-section">
                <div class="softkeys softkeys--lg" data-target="input[name='code']"></div>
            </div>
        </div>

        <!-- Results Table -->
        <div class="table-card">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">四字码</th>
                        <th scope="col">国家</th>
                        <th scope="col">省/州</th>
                        <th scope="col">城市</th>
                        <th scope="col">机场名</th>
                    </tr>
                </thead>
                <tbody id="my_table">
                    <tr>
                        <th scope="row">...</th>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                    </tr>
                </tbody>
            </table>
            <div class="results-info">
                <span><span class="dot"></span>最多显示 100 条结果</span>
                <span id="result-count"></span>
            </div>
        </div>
    </div>

	<script src="js/jquery-1.11.0.min.js?v=20261002125637"></script>
	<script src="js/softkeys-0.0.1.js?v=20261002125637"></script>
	<script src="js/gzip-loader.js?v=20261005150000"></script>
	<script src="js/airports_filtered.js.gz.js?v=20261005150000"></script>
	<script type="text/javascript">
		$(document).ready(function(){
            $('.softkeys').softkeys({
                target : $('.softkeys').data('target'),
                layout : [
                    [
                        'Q','W','E','R','T','Y','U','I','O','P',
                        'delete'
                    ],
                    [
                        'A','S','D','F','G','H','J','K','L',
                    ],
                    [
                        'Z','X','C','V','B','N','M',
                    ]
                ]
            });
        });
	</script>
<script>
    var $input = $('input[name="code"]');
    var $charCount = $('.char-count');
    var $statusIndicator = $('.status-indicator');
    var $statusText = $('.status-text');
    var $resultCount = $('#result-count');

    var my_table = document.getElementById("my_table")

    // 解压并执行 gzip 压缩版的 airports_filtered.js（等效于原来的 <script src>）
    GzipLoader.exec(window.__GZ_B64__);

    search("");

    updateCharCount($input.val().length);

    $input.on('input', function() {
        var value = $(this).val();
        if (value.length > 4) {
            $(this).val(value.substring(0, 4));
            value = $(this).val();
        }
        updateCharCount(value.length);
        search(value);
    });

    function updateCharCount(count) {
        $charCount.text(count + '/4');
        if (count === 3) {
            $charCount.removeClass('warning').addClass('danger');
        } else if (count >= 2) {
            $charCount.removeClass('danger').addClass('warning');
        } else {
            $charCount.removeClass('warning danger');
        }
    }

    function search(value) {
        let filteredItems = airportData.filter(item => item.icao.startsWith(value));
        let total = filteredItems.length;
        filteredItems = filteredItems.slice(0, Math.min(100, filteredItems.length));

        my_table.innerHTML = '';

        filteredItems.forEach(function(currentValue, index, arr){
            var li_0 = document.createElement("tr");
            li_0.innerHTML = '      <th scope="row"><span class="my_badge">'+currentValue.icao+'</span></th>\n' +
                '      <td><div>'+currentValue.country+'</div><div>'+currentValue.country_chi+'</div></td>\n' +
                '      <td><div>'+currentValue.state+'</div><div>'+currentValue.state_chi+'</div></td>\n' +
                '      <td><div>'+currentValue.city+'</div><div>'+currentValue.city_chi+'</div></td>\n' +
                '      <td><div>'+currentValue.name+'</div><div>'+currentValue.airport_chi+'</div></td>\n'
            my_table.appendChild(li_0);
        })

        var li_0 = document.createElement("tr");
        li_0.innerHTML = '<th scope="row">...</th>\n' +
            '      <td>...</td>\n' +
            '      <td>...</td>\n' +
            '      <td>...</td>\n' +
            '      <td>...</td>'
        my_table.appendChild(li_0);

        $resultCount.text(total > 100 ? '共 ' + total + ' 条' : '');
    }

    $input.on('keypress', function(e) {
        if ($(this).val().length >= 3) {
            e.preventDefault();
            return false;
        }
    });
</script>
</body>
</html>
