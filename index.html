<!DOCTYPE html>
<html lang="zh" style="font-size: 20px;">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>航空公司呼号查询</title>
	<meta name="theme-color" content="#0f172a">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="img/text-style.svg?v=20261006191540">
    <link rel="stylesheet" href="css/softkeys-0.0.1.css?v=20261009120000">
</head>
<body>
    <div class="page-wrapper">
        <!-- Mobile App Header (mobile only) -->
        <header class="app-header">
            <div class="app-header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
            </div>
            <div class="app-header-text">
                <div class="app-header-title">航空公司呼号查询</div>
                <div class="app-header-sub">Airline Callsign Lookup</div>
            </div>
        </header>

        <!-- Input + Keyboard -->
        <div class="input-card">
            <div class="input-label">ICAO Code</div>
            <form>
                <div>
                    <input type="text" name="code" class="form-control" disabled style="font-size:2rem;">
                </div>
            </form>
            <div class="keyboard-section">
                <div class="softkeys softkeys--lg" data-target="input[name='code']"></div>
            </div>
        </div>

        <!-- Results Table -->
        <div class="table-card">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">三字码</th>
                        <th scope="col">公司</th>
                        <th scope="col">国籍</th>
                        <th scope="col">英文呼号</th>
                        <th scope="col">中文呼号</th>
                    </tr>
                </thead>
                <tbody id="my_table">
                    <tr>
                        <th scope="row">...</th>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                    </tr>
                </tbody>
            </table>
            <div class="results-info">
                <span><span class="dot"></span>最多显示 40 条结果</span>
                <span id="result-count"></span>
            </div>
        </div>
    </div>



	<script src="js/jquery-1.11.0.min.js?v=20261006191540"></script>
	<script src="js/softkeys-0.0.1.js?v=20261006191540"></script>
	<script src="js/airline_code.js?v=20261006191540"></script>
	<script type="text/javascript">
		$(document).ready(function(){
            $('.softkeys').softkeys({
                target : $('.softkeys').data('target'),
                layout : [
                    [
                        'Q','W','E','R','T','Y','U','I','O','P',
                        'delete'
                    ],
                    [
                        'A','S','D','F','G','H','J','K','L',
                    ],
                    [
                        'Z','X','C','V','B','N','M',
                    ]
                ]
            });
        });
	</script>
<script>
    var $input = $('input[name="code"]');
    var $resultCount = $('#result-count');
    var my_table = document.getElementById("my_table");

    search("");

    $input.on('input', function() {
        var value = $(this).val();
        if (value.length > 3) {
            $(this).val(value.substring(0, 3));
            value = $(this).val();
        }
        search(value);
    });

    function search(value) {
        let filteredItems = airline_code.filter(item => item.threeLD.startsWith(value));
        let total = filteredItems.length;
        filteredItems = filteredItems.slice(0, Math.min(40, filteredItems.length));

        my_table.innerHTML = '';

        filteredItems.forEach(function(currentValue, index, arr){
            var li_0 = document.createElement("tr");
            li_0.innerHTML = '      <th scope="row" class="cell-code"><span class="my_badge">'+currentValue.threeLD+'</span></th>\n' +
                '      <td class="cell-airline">'+currentValue.AIRLINE+'</td>\n' +
                '      <td class="cell-nation">'+currentValue.NATION+'</td>\n' +
                '      <td class="cell-eng"><span class="badge-eng">'+currentValue.ENG+'</span></td>\n' +
                '      <td class="cell-chi"><span class="badge-chi">'+currentValue.CHI+'</span></td>\n'
            my_table.appendChild(li_0);
        });

        var li_0 = document.createElement("tr");
        li_0.className = 'row-more';
        li_0.innerHTML = '<th scope="row">...</th>\n' +
            '      <td>...</td>\n' +
            '      <td>...</td>\n' +
            '      <td>...</td>\n' +
            '      <td>...</td>'
        my_table.appendChild(li_0);

        $resultCount.text(total > 40 ? '共 ' + total + ' 条' : '');
    }

    $input.on('keypress', function(e) {
        if ($(this).val().length >= 3) {
            e.preventDefault();
            return false;
        }
    });
</script>
<script src="js/d1.js?v=20261009130000"></script>
</body>
</html>
